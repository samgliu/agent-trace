services:
  agenttrace:
    build:
      context: .
    image: agenttrace:local
    volumes:
      - ./.agenttrace:/app/.agenttrace
    working_dir: /app

  api:
    build:
      context: .
    image: agenttrace:local
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["agenttrace.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: ./agent_apps/customer_service/.env
        required: false
      - path: ./agenttrace/api/.env
        required: false
    environment:
      AGENTTRACE_DB: /app/.agenttrace/agenttrace.db
      AGENTTRACE_MCP_TOOLS_URL: http://mcp-tools:8010/mcp/
      AGENTTRACE_AGENT_SERVICE_URL: ${AGENTTRACE_AGENT_SERVICE_URL:-http://agent-service:8020}
      AGENTTRACE_AGENT_SERVICE_TIMEOUT_SECONDS: ${AGENTTRACE_AGENT_SERVICE_TIMEOUT_SECONDS:-300}
    ports:
      - "8000:8000"
    volumes:
      - ./.agenttrace:/app/.agenttrace
    working_dir: /app
    depends_on:
      - mcp-tools
      - agent-service

  agent-service:
    build:
      context: .
    image: agenttrace:local
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["agent_apps.customer_service.api:app", "--host", "0.0.0.0", "--port", "8020"]
    env_file:
      - path: ./agent_apps/customer_service/.env
        required: false
    environment:
      AGENTTRACE_MCP_TOOLS_URL: http://mcp-tools:8010/mcp/
      AGENTTRACE_LLM_TIMEOUT_SECONDS: 180
    ports:
      - "8020:8020"
    working_dir: /app
    depends_on:
      - mcp-tools

  mcp-tools:
    build:
      context: .
    image: agenttrace:local
    entrypoint: ["python", "-m", "agenttrace.mcp_tools.server"]
    command: ["--transport", "http", "--host", "0.0.0.0", "--port", "8010"]
    ports:
      - "8010:8010"
    working_dir: /app

  web:
    build:
      context: ./web
    image: agenttrace-web:local
    env_file:
      - path: ./web/.env
        required: false
    ports:
      - "5173:5173"
    depends_on:
      - api

  e2e:
    build:
      context: ./e2e
    image: agenttrace-e2e:local
    env_file:
      - path: ./agenttrace/api/.env
        required: false
    environment:
      PLAYWRIGHT_BASE_URL: http://web:5173
      PLAYWRIGHT_BROWSER_API_BASE_URL: http://localhost:8000
      PLAYWRIGHT_DOCKER_API_BASE_URL: http://api:8000
      PLAYWRIGHT_AUTH_TOKEN: ${PLAYWRIGHT_AUTH_TOKEN:-}
    volumes:
      - ./e2e/playwright-report:/app/e2e/playwright-report
      - ./e2e/test-results:/app/e2e/test-results
    depends_on:
      - web
      - api
      - agent-service
      - mcp-tools
