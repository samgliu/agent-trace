name: Development

on:
  push:
    branches:
      - development

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Run backend tests
        run: python -m unittest discover
      - name: Run deterministic eval suite
        run: python -m agenttrace.cli eval support-triage

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Lint frontend
        working-directory: web
        run: corepack pnpm lint
      - name: Run frontend tests
        working-directory: web
        run: corepack pnpm test
      - name: Build frontend
        working-directory: web
        run: corepack pnpm build

  e2e:
    name: Dockerized Playwright e2e
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
      - name: Run e2e suite
        run: docker compose run --rm --build e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
